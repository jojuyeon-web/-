<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스페이스 슈터</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">🚀 스페이스 슈터</div>
            <ul class="nav-links">
                <li><a href="#home">홈</a></li>
                <li><a href="#game">게임하기</a></li>
                <li><a href="#rules">게임규칙</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home" class="hero">
            <h1>🚀 스페이스 슈터</h1>
            <p>외계인의 침공을 막아라!</p>
            <button id="start-btn" class="btn">게임 시작</button>
        </section>

        <section id="game" class="game-section">
            <div class="game-info">
                <div class="score">
                    <span>점수: </span>
                    <span id="score">0</span>
                </div>
                <div class="lives">
                    <span>생명: </span>
                    <span id="lives">❤️❤️❤️</span>
                </div>
                <div class="level">
                    <span>레벨: </span>
                    <span id="level">1</span>
                </div>
                <button id="restart-btn" class="btn">다시 시작</button>
            </div>

            <div class="game-container">
                <canvas id="game-canvas" width="800" height="600"></canvas>
            </div>

            <div id="game-over" class="game-over hidden">
                <h2>게임 오버!</h2>
                <p>최종 점수: <span id="final-score"></span></p>
                <p>도달 레벨: <span id="final-level"></span></p>
                <button id="play-again-btn" class="btn">다시 플레이</button>
            </div>
        </section>

        <section id="rules" class="rules-section">
            <h2>게임 규칙</h2>
            <div class="rules-container">
                <div class="rule-card">
                    <div class="rule-icon">⬅️➡️</div>
                    <p>화살표 키로 우주선을 이동하세요</p>
                </div>
                <div class="rule-card">
                    <div class="rule-icon">🔫</div>
                    <p>스페이스바로 미사일을 발사하세요</p>
                </div>
                <div class="rule-card">
                    <div class="rule-icon">👾</div>
                    <p>외계인을 처치하면 점수를 얻습니다</p>
                </div>
                <div class="rule-card">
                    <div class="rule-icon">💥</div>
                    <p>외계인과 충돌하면 생명을 잃습니다</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 스페이스 슈터. 모든 권리 보유.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
